<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TruthLens</title>

  <!-- Google Fonts — matching the main app exactly -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,700;1,6..72,400&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ── Reset ────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design Tokens — Light Editorial Mode (matches app results page) */
    :root {
      --bg:              #f5f4f0;
      --bg-surface:      #eceae4;
      --bg-white:        #ffffff;
      --text-primary:    #0f0f0f;
      --text-secondary:  #555;
      --text-muted:      #999;
      --accent-red:      #c0392b;
      --border:          #d0cec8;
      --border-strong:   #0f0f0f;

      /* Verdict colours */
      --color-real:        #3a7d0a;
      --color-real-bg:     #f0f7e8;
      --color-real-border: #a8d06a;
      --color-suspicious:  #a05c00;
      --color-suspicious-bg: #fef6e4;
      --color-suspicious-border: #e6b96a;
      --color-fake:        #b91c1c;
      --color-fake-bg:     #fdf0f0;
      --color-fake-border: #f0a0a0;

      --font-display: 'Newsreader', serif;
      --font-body:    'Work Sans', sans-serif;
      --font-mono:    'Courier New', monospace;
    }

    /* ── Body ─────────────────────────────────────────────────────────── */
    body {
      width: 400px;
      min-height: 200px;
      max-height: 600px;
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 13px;
      line-height: 1.5;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* ── Header ────────────────────────────────────────────────────────── */
    .header {
      padding: 12px 16px 10px;
      background: var(--bg-white);
      border-bottom: 3px solid var(--border-strong);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text-primary);
    }

    .logo-dot { color: var(--accent-red); }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ref-no {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .bookmark-icon {
      width: 16px;
      height: 16px;
      opacity: 0.4;
      cursor: pointer;
    }

    .header-rule {
      margin-top: 8px;
      border: none;
      border-top: 1px solid var(--border);
    }

    .tab-url {
      margin-top: 7px;
      font-size: 10px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: var(--font-mono);
      letter-spacing: 0.2px;
    }

    /* ── Main Content ──────────────────────────────────────────────────── */
    .content {
      padding: 0 16px 14px;
    }

    /* ── Analyze Button ────────────────────────────────────────────────── */
    .idle-container { padding: 16px 0 4px; }

    .analyze-btn {
      width: 100%;
      padding: 12px 20px;
      background: var(--text-primary);
      color: var(--bg-white);
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .analyze-btn:hover { background: var(--accent-red); }
    .analyze-btn:active { transform: scale(0.98); }

    .idle-hint {
      margin-top: 12px;
      padding: 10px 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .idle-hint strong { color: var(--text-primary); }

    /* ── Loading State ─────────────────────────────────────────────────── */
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 20px;
      gap: 14px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid var(--border);
      border-top-color: var(--accent-red);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .loading-stage {
      font-size: 11px;
      color: var(--text-muted);
      font-style: italic;
    }

    /* ── Result Area ───────────────────────────────────────────────────── */
    .result-container { animation: fadeIn 0.3s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Verification Header ───────────────────────────────────────────── */
    .verification-header {
      text-align: center;
      padding: 14px 0 10px;
      border-bottom: 1px solid var(--border);
    }

    .verification-label {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .verification-id {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-muted);
    }

    /* ── Score Block (Big Number like main app) ────────────────────────── */
    .score-block {
      text-align: center;
      padding: 20px 0 8px;
    }

    .score-number {
      font-family: var(--font-display);
      font-size: 72px;
      font-weight: 700;
      line-height: 1;
      color: var(--text-primary);
      letter-spacing: -3px;
    }

    .score-label {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ── Score Bar ─────────────────────────────────────────────────────── */
    .score-bar-wrap {
      padding: 0 4px 16px;
    }

    .score-bar-labels {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 8px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .score-bar-track {
      height: 6px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .score-bar-fill {
      height: 100%;
      background: var(--text-primary);
      transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ── Article Title ─────────────────────────────────────────────────── */
    .article-title {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text-primary);
      padding: 10px 0 14px;
      border-bottom: 1px solid var(--border);
    }

    /* ── Verdict Badge (left-panel style) ──────────────────────────────── */
    .verdict-section {
      padding: 12px 0 10px;
      border-bottom: 1px solid var(--border);
    }

    .section-fig-label {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .verdict-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px 5px 10px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      font-family: var(--font-body);
      border: 1.5px solid;
    }

    .verdict-badge .verdict-icon {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 900;
      flex-shrink: 0;
    }

    .verdict-real        { color: var(--color-real);       background: var(--color-real-bg);        border-color: var(--color-real-border); }
    .verdict-real .verdict-icon { background: var(--color-real); color: #fff; }

    .verdict-suspicious  { color: var(--color-suspicious); background: var(--color-suspicious-bg);  border-color: var(--color-suspicious-border); }
    .verdict-suspicious .verdict-icon { background: var(--color-suspicious); color: #fff; }

    .verdict-fake        { color: var(--color-fake);       background: var(--color-fake-bg);        border-color: var(--color-fake-border); }
    .verdict-fake .verdict-icon { background: var(--color-fake); color: #fff; }

    /* ── Signal Analysis Section ───────────────────────────────────────── */
    .signals-section {
      padding: 12px 0 0;
      border-bottom: 1px solid var(--border);
    }

    .signal-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    .signal-row:last-child { border-bottom: none; }

    .signal-left { flex: 1; }

    .signal-name {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-primary);
      display: block;
    }

    .signal-sublabel {
      font-size: 9px;
      color: var(--text-muted);
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .signal-score {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1;
      min-width: 36px;
      text-align: right;
    }

    /* ── Explanation ───────────────────────────────────────────────────── */
    .explanation-section {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .explanation-label {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .explanation-text {
      font-size: 12px;
      color: var(--accent-red);
      line-height: 1.6;
      font-style: italic;
    }

    /* ── Cross-Verification Sources ────────────────────────────────────── */
    .sources-section {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .sources-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 6px;
    }

    .source-item {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .no-sources-box {
      margin-top: 6px;
      padding: 8px 10px;
      border: 1px solid var(--color-suspicious-border);
      background: var(--color-suspicious-bg);
    }

    .no-sources-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--color-suspicious);
      margin-bottom: 4px;
    }

    .no-sources-text {
      font-size: 10px;
      color: var(--color-suspicious);
      font-style: italic;
    }

    /* ── View Full Link ────────────────────────────────────────────────── */
    .view-full-link {
      display: block;
      margin-top: 14px;
      padding: 10px;
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-primary);
      text-decoration: none;
      border: 2px solid var(--text-primary);
      transition: all 0.15s ease;
    }

    .view-full-link:hover {
      background: var(--text-primary);
      color: var(--bg-white);
    }

    /* ── Error State ───────────────────────────────────────────────────── */
    .error-container {
      padding: 24px 8px;
      text-align: center;
      animation: fadeIn 0.3s ease;
    }

    .error-icon { font-size: 24px; margin-bottom: 8px; }

    .error-title {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
      color: var(--color-fake);
      margin-bottom: 6px;
    }

    .error-message {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .retry-btn {
      padding: 8px 20px;
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: 1.5px solid var(--border-strong);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .retry-btn:hover {
      background: var(--text-primary);
      color: var(--bg-white);
    }

    /* ── Footer ────────────────────────────────────────────────────────── */
    .footer {
      padding: 8px 16px;
      background: var(--bg-white);
      border-top: 3px double var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-text {
      font-size: 8px;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .footer-version {
      font-size: 8px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    /* ── Cached Badge ──────────────────────────────────────────────────── */
    .cached-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .cached-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--color-suspicious);
    }
  </style>
</head>
<body>

  <!-- ═══ HEADER ═══ -->
  <div class="header">
    <div class="header-top">
      <span class="logo">Truth<span class="logo-dot">Lens</span></span>
      <div class="header-meta">
        <span class="ref-no" id="ref-no">REF NO. —</span>
      </div>
    </div>
    <hr class="header-rule">
    <div class="tab-url" id="tab-url">Loading…</div>
  </div>

  <!-- ═══ CONTENT ═══ -->
  <div class="content" id="main-content">
    <!-- Populated by popup.js -->
  </div>

  <!-- ═══ FOOTER ═══ -->
  <div class="footer">
    <span class="footer-text">Multi-Signal AI Analysis</span>
    <span class="footer-version">v1.0.0</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
